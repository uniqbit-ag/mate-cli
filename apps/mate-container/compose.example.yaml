# The Mate appliance, as one container.
#
# For reading and for starting: `docker compose -f compose.example.yaml up`
# brings up Studio against the companions you mount. Agent sessions — Claude
# Code or OpenCode — start on demand from Studio's terminal.
#
# Studio is guarded by an access token: open the address it prints in the log
# (`docker compose logs mate`), or pin one below. It still has no user
# accounts, so publish it on a loopback address as below, or put a reverse
# proxy with TLS in front of it.

services:
  mate:
    # Follow a channel, or pin the exact version you want to stay on:
    #   ghcr.io/uniqbit-ag/mate-cli/mate-appliance:0.17.0
    image: ghcr.io/uniqbit-ag/mate-cli/mate-appliance:latest

    # The image runs as uid/gid 10001. The companions volume has to be
    # writable by that identity, which is the one thing most worth getting
    # right before the first start: the alternative is discovering it through
    # a failed save an hour later.
    #
    # Either chown the directory on the host:
    #     sudo chown -R 10001:10001 ./companions
    # or map the container's user to your own, as below.
    user: "10001:10001"
    # With rootless Podman, map your own user to that identity instead:
    # userns_mode: "keep-id:uid=10001,gid=10001"

    volumes:
      # The Companion Repositories this container serves. Mount either one
      # companion directly, or a directory holding several.
      - ./companions:/companions

      # Everything an operator supplies arrives at run time; nothing is baked
      # into the image. This file is where credentials and a pinned token
      # belong, so they stay out of the process listing.
      - ./appliance.yaml:/etc/mate/appliance.yaml:ro

      # Only for Git remotes over SSH: a key and the hosts it may talk to,
      # readable by uid 10001. HTTPS remotes need neither.
      # - ./ssh/id_ed25519:/home/mate/.ssh/id_ed25519:ro
      # - ./ssh/known_hosts:/home/mate/.ssh/known_hosts:ro

    ports:
      # Studio, the only port. Bound to loopback here so nothing is reachable
      # off-host until you have put something in front. Keep the host port
      # equal to 4097, or add `localhost:<host port>` to
      # MATE_STUDIO_ALLOWED_HOSTS: Studio refuses a Host it does not expect.
      - "127.0.0.1:4097:4097"

    environment:
      # Which companion every agent session runs against. Required only when
      # more than one is found — otherwise the single one is used.
      MATE_COMPANION: acme

      # Check a companion out on first start. An existing checkout is used as
      # it is: never re-cloned, never reset.
      # MATE_COMPANION_REPOS: https://github.com/example/acme-companion.git

      # Whether agent sessions synchronize the companion with its remote. Off,
      # each launch gets --no-git and never contacts the remote.
      # MATE_GIT_SYNC: "true"

      # Studio's save path and its agent terminal, both on by default. The
      # terminal needs the save path: turning writability off turns it off.
      MATE_STUDIO_WRITABLE: "true"
      MATE_STUDIO_TERMINAL: "true"

      # How long a session keeps running after its browser tab goes away.
      MATE_STUDIO_DETACH_MINUTES: "30"

      # Pin the access token (32+ characters) so it survives restarts and stays
      # out of the log. Better placed in appliance.yaml as `studioToken:`.
      # MATE_STUDIO_TOKEN: ...

      # Behind a TLS-terminating proxy: the exact address users open, and the
      # host it sends. Studio trusts no forwarded headers; the proxy must
      # enforce TLS and be the only way to reach this port.
      # MATE_STUDIO_PUBLIC_ORIGIN: https://studio.acme.test
      # MATE_STUDIO_ALLOWED_HOSTS: studio.acme.test

      # The agents' credentials. Put them in the configuration file rather than
      # here if you would rather they were not in a process listing.
      # ANTHROPIC_API_KEY: ...

    # The container is Studio: if Studio stops, every agent session it started
    # is stopped and the container exits with Studio's status. An agent
    # session ending does not stop the container.
    restart: unless-stopped

    # Studio gives each session 5 seconds after TERM, then KILL.
    stop_grace_period: 30s
