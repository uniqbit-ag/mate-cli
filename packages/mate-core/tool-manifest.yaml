# Exact versions of the third-party tools that both a member's computer and the
# Mate images use. One bump here reaches setup, the Context7 launch and both
# images. Every version is exact: no range, channel, or "latest".
#
# Entries keep the image inputs' tool format. The images read them through
# `readImageInputs()`; mate-core reads `version` through `toolVersion()` and
# TokenSave's `rust_version`.
# npm tools mate-core depends on also stay exact in its package.json, held
# equal to this file by `lib/tool-manifest.test.ts`.

schema: 1

tools:
  openspec:
    detect: openspec
    package: "@fission-ai/openspec"
    version: 1.15.0
    source: npm_global
    # Resolved through locks/global-tools.package-lock.json, not `@latest`.
    # Mate now ships its own OpenSpec CLI, so the image no longer requires this
    # global copy. It leaves the global-tools manifest and lock when they are
    # regenerated after the first release that bundles OpenSpec.

  context7:
    detect: context7-mcp
    package: "@upstash/context7-mcp"
    # The Context7 launch in apps/mate-cli reads this version.
    version: 4.2.0
    source: npm_global

  rtk:
    detect: rtk
    version: 1.1.0
    source: github_release
    base_url: https://github.com/rtk-ai/rtk/releases/download
    artifacts:
      # The project publishes a musl build for x86_64 and a gnu build for
      # aarch64; the musl binary is static and runs on the glibc base image.
      amd64:
        file: rtk-x86_64-unknown-linux-musl.tar.gz
        sha256: 9454ad1b9489daa57ab0a9f4ebe2faaf4dc82b8a0f26c9e5135151abd7c9378d
      arm64:
        file: rtk-aarch64-unknown-linux-gnu.tar.gz
        sha256: a5c00c3ab0129884bcb757d348afc1a650efa0f4f0769da97c341f28f89719ed

  tokensave:
    detect: tokensave
    version: 7.15.0
    # `rust-version` of this release's Cargo.toml; setup uses Cargo only at or
    # above it. Bump with `version`.
    rust_version: 1.95.0
    source: github_release
    base_url: https://github.com/aovestdipaperino/tokensave/releases/download
    # Prebuilt release binaries, so the image needs no Rust toolchain.
    artifacts:
      amd64:
        file: tokensave-v7.15.0-x86_64-linux.tar.gz
        sha256: 3da8d0e52da38d2b477d92e2548a68795dbda355bb274d120ee6a77f391b57a4
      arm64:
        file: tokensave-v7.15.0-aarch64-linux.tar.gz
        sha256: 0143e3e99c5b3a2a97790fbf50846cfb64a18a1035bf2fd63a60f511c4b7c5e2

  skills:
    detect: skills
    package: skills
    version: 1.7.6
    source: npm_dependency

  react-doctor:
    detect: react-doctor
    package: react-doctor
    version: 0.9.13
    source: npm_dependency
