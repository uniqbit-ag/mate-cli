name: CI

# The pull-request gate. Branch protection on main requires only `ci-ok`, which
# passes when every job below succeeded or was skipped by its change filter, so
# job names can change without touching repository settings.
#
# Real-agent e2e stays out: it needs MATE_RUN_REAL_AGENT_TESTS=1 plus real
# claude/opencode binaries, and this workflow provides neither.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      container: ${{ steps.filter.outputs.container }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            container:
              - "apps/mate-container/**"
              - ".github/workflows/ci.yml"
            docs:
              - "apps/docs/**"
              - ".github/workflows/ci.yml"

  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install expect for the interactive e2e suite
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # Each package runs even when an earlier one failed, so one run reports every failure.
      - name: Test mate-core
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/mate-core
        run: bun run test --reporter=junit --reporter-outfile=junit.xml

      - name: Test mate
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/mate-cli
        run: bun run test --reporter=junit --reporter-outfile=junit.xml

      - name: Test mate-opencode-plugin
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/mate-opencode-plugin
        run: bun run test --reporter=junit --reporter-outfile=junit.xml

      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: |
            packages/mate-core/junit.xml
            apps/mate-cli/junit.xml
            apps/mate-opencode-plugin/junit.xml
          if-no-files-found: warn

  test-container:
    name: Test mate-container
    needs: changes
    if: ${{ needs.changes.outputs.container == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test mate-container
        env:
          # The runner's preinstalled Podman would be found first.
          MATE_CONTAINER_RUNTIME: docker
        run: bun run --filter @uniqbit/mate-container test

  docs:
    name: Check docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Astro check
        run: bun run docs:check

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, static, test, test-container, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required CI job ended with '$result'."; exit 1 ;;
            esac
          done
