name: CI

# The pull-request gate, as one job to keep runner minutes down: one checkout,
# one install, the product suites on every PR, and the remaining app suites only
# when their files changed. Branch protection on main requires `ci-ok`.
#
# mate-cli's integration/e2e suite stays out: it drives a TTY through `expect`,
# which the ubuntu-latest runner image does not ship.
#
# Real-agent e2e stays out: it needs MATE_RUN_REAL_AGENT_TESTS=1 plus real
# claude/opencode binaries, and this workflow provides neither.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `bun install`'s prepare script installs lefthook hooks; tests that
      # commit inside the checkout must not fire them (.guildhall/verify
      # exports the same).
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            container:
              - "apps/mate-container/**"
              - ".github/workflows/ci.yml"
            vscode:
              - "apps/mate-vscode/**"
              - ".github/workflows/ci.yml"
            docs:
              - "apps/docs/**"
              - "packages/mate-core/src/cli/usage.ts"
              - ".github/workflows/ci.yml"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Unfiltered: a manifest-only change can stale both image locks.
      - name: Check image lock drift
        run: bun run image-locks:check

      - name: Test image lock tooling
        run: bun run test:image-locks

      - name: Test mate-container
        if: steps.changes.outputs.container == 'true'
        env:
          # The runner's preinstalled Podman would be found first.
          MATE_CONTAINER_RUNTIME: docker
        run: bun run --filter @uniqbit/mate-container test

      - name: Test mate-vscode
        if: steps.changes.outputs.vscode == 'true'
        run: bun run --filter @uniqbit/mate-vscode test

      # Includes the command-reference check.
      - name: Check docs
        if: steps.changes.outputs.docs == 'true'
        run: bun run docs:check

      # The product suites run on every PR, not path-gated: without them a red
      # mate-core, mate-cli or mate-studio could reach main unnoticed.
      - name: Test mate-core
        run: bun run --filter @uniqbit/mate-core test

      - name: Test mate-cli (unit)
        run: bun run --cwd apps/mate-cli test:unit

      - name: Typecheck mate-studio
        run: bun run --cwd packages/mate-studio typecheck

      - name: Test mate-studio
        run: bun run --cwd packages/mate-studio test
