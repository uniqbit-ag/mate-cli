name: CI

# The pull-request gate, as one job to keep runner minutes down: one checkout, one
# install, and each app's tests only when its files changed. Branch protection on
# main requires `ci-ok`.
#
# Real-agent e2e stays out: it needs MATE_RUN_REAL_AGENT_TESTS=1 plus real
# claude/opencode binaries, and this workflow provides neither.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            container:
              - "apps/mate-container/**"
              - ".github/workflows/ci.yml"
            factory:
              - "apps/mate-factory/**"
              - ".github/workflows/ci.yml"
            vscode:
              - "apps/mate-vscode/**"
              - ".github/workflows/ci.yml"
            docs:
              - "apps/docs/**"
              - "packages/mate-core/src/cli/usage.ts"
              - ".github/workflows/ci.yml"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test mate-container
        if: steps.changes.outputs.container == 'true'
        env:
          # The runner's preinstalled Podman would be found first.
          MATE_CONTAINER_RUNTIME: docker
        run: bun run --filter @uniqbit/mate-container test

      - name: Test mate-factory
        if: steps.changes.outputs.factory == 'true'
        env:
          MATE_CONTAINER_RUNTIME: docker
        run: bun run --filter @uniqbit/mate-factory test

      - name: Test mate-vscode
        if: steps.changes.outputs.vscode == 'true'
        run: bun run --filter @uniqbit/mate-vscode test

      # Includes the command-reference check.
      - name: Check docs
        if: steps.changes.outputs.docs == 'true'
        run: bun run docs:check
