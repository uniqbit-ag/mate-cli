name: Publish appliance image

# Explicitly dispatched, never triggered by a release page or a tag push.
#
# The release configurations disable GitHub release pages, and release-it
# pushes the tag before `publish.sh` publishes to npm — so neither event tells
# us that the packages the image installs actually exist. `publish.sh` asks for
# this workflow once every npm publication has succeeded, and the same dispatch
# is the retry path: it republishes nothing to npm and does not run release-it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The exact published version to build an image for (e.g. 0.17.0 or 0.17.0-canary.4)."
        required: true
        type: string
      channel:
        description: "Which moving tag this version belongs to."
        required: true
        type: choice
        options: [latest, canary]
      ref:
        description: "The pushed release tag to build from. Its checkout supplies the recipe and the locks."
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  # One image per version at a time, but never serialize unrelated versions.
  group: publish-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Everything that can refuse the request is checked before a single layer is
  # built: the tag's own recipe, its pinned version, and the packages the image
  # would install.
  # -------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: The tag must carry the image assets
        run: |
          set -euo pipefail
          missing=()
          for asset in \
            apps/mate-container/Dockerfile \
            apps/mate-container/image-inputs.yaml \
            apps/mate-container/scripts/entrypoint.sh \
            apps/mate-container/locks/global-tools.package-lock.json \
            apps/mate-container/locks/local-workspace.package-lock.json
          do
            [[ -f "$asset" ]] || missing+=("$asset")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::${{ inputs.ref }} carries no image recipe: ${missing[*]}" >&2
            echo "A prerequisite-only release cannot produce an image; nothing was built." >&2
            exit 1
          fi

      - name: The channel must match the version
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          case "${{ inputs.channel }}" in
            latest)
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::$version is not a stable version, so it cannot be published as latest." >&2
                exit 1
              } ;;
            canary)
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]] || {
                echo "::error::$version is not a canary version, so it cannot be published as canary." >&2
                exit 1
              } ;;
          esac

      - name: The tag's inputs must pin the version being published
        run: |
          set -euo pipefail
          pinned="$(sed -n '/^mate:/,/^[^ ]/p' apps/mate-container/image-inputs.yaml \
                    | sed -n 's/^  version: //p' | head -1)"
          if [[ "$pinned" != "${{ inputs.version }}" ]]; then
            echo "::error::${{ inputs.ref }} pins Mate $pinned, but this dispatch asks for ${{ inputs.version }}." >&2
            exit 1
          fi
          locked="$(node -p 'require("./apps/mate-container/locks/global-tools.package.json").dependencies["@uniqbit/mate"]')"
          if [[ "$locked" != "${{ inputs.version }}" ]]; then
            echo "::error::the global tool lock pins Mate $locked, not ${{ inputs.version }}." >&2
            exit 1
          fi

      - name: The packages the image installs must already be published
        run: |
          set -euo pipefail
          for package in @uniqbit/mate-core @uniqbit/mate-opencode-plugin @uniqbit/mate; do
            if ! npm view "$package@${{ inputs.version }}" version >/dev/null 2>&1; then
              echo "::error::$package@${{ inputs.version }} is not on the registry; nothing was built." >&2
              echo "Dispatch again once npm publication has succeeded." >&2
              exit 1
            fi
          done

      - name: Name the image
        id: name
        run: echo "image=${{ env.REGISTRY }}/${{ github.repository }}/mate-appliance" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # One job per architecture. Each builds, verifies the image offline, and
  # pushes an architecture-specific digest — no public tag yet, so a failed
  # compatibility check publishes nothing an operator could pull.
  # -------------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the build arguments from the release-owned inputs
        id: args
        working-directory: apps/mate-container
        run: |
          set -euo pipefail
          bun --eval '
            import { buildArgs } from "./scripts/build.ts";
            import { readImageInputs } from "./src/image-inputs.ts";
            const args = buildArgs(readImageInputs(), "${{ inputs.version }}");
            const pairs = args.filter((_, index) => index % 2 === 1);
            console.log(pairs.join("\n"));
          ' > /tmp/build-args.txt
          {
            echo "args<<EOF"
            cat /tmp/build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build for ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/mate-container
          file: apps/mate-container/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.args }}
          load: true
          push: false
          tags: mate-appliance:${{ inputs.version }}-${{ matrix.arch }}
          provenance: false

      - name: Verify the built image offline
        run: |
          set -euo pipefail
          bun apps/mate-container/scripts/verify-image.ts \
            --image mate-appliance:${{ inputs.version }}-${{ matrix.arch }} \
            --mate-version ${{ inputs.version }} \
            --arch ${{ matrix.arch }}

      - name: Push the architecture image by digest
        id: push
        run: |
          set -euo pipefail
          target="${{ needs.validate.outputs.image }}:build-${{ inputs.version }}-${{ matrix.arch }}"
          docker tag mate-appliance:${{ inputs.version }}-${{ matrix.arch }} "$target"
          docker push "$target"
          digest="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

    outputs:
      image: ${{ needs.validate.outputs.image }}

  # -------------------------------------------------------------------------
  # Only once both architectures have passed does anything an operator would
  # pull appear. The exact version is written once and never overwritten; the
  # channel tag is moved only if this version is newer than what it points at.
  # -------------------------------------------------------------------------
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the exact version, preserving one already published
        id: version_tag
        run: |
          set -euo pipefail
          image="${{ needs.validate.outputs.image }}"
          exact="$image:${{ inputs.version }}"

          # An exact version is immutable: a retry of a version already
          # published keeps the digest operators are already pulling.
          if docker buildx imagetools inspect "$exact" >/dev/null 2>&1; then
            echo "$exact is already published; keeping its existing digest."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker buildx imagetools create --tag "$exact" \
            "$image@${{ needs.build.outputs.amd64_digest || '' }}" 2>/dev/null || true

          docker buildx imagetools create --tag "$exact" \
            "$image:build-${{ inputs.version }}-amd64" \
            "$image:build-${{ inputs.version }}-arm64"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Move the channel tag only forwards
        run: |
          set -euo pipefail
          image="${{ needs.validate.outputs.image }}"
          channel="$image:${{ inputs.channel }}"
          version="${{ inputs.version }}"

          current=""
          if docker buildx imagetools inspect "$channel" --format '{{ json .Image }}' > /tmp/channel.json 2>/dev/null; then
            current="$(node -p '
              try {
                const image = JSON.parse(require("fs").readFileSync("/tmp/channel.json", "utf8"));
                const labels = (image.config && image.config.Labels) || {};
                labels["ai.mate.version"] || "";
              } catch { "" }
            ')"
          fi

          if [[ -n "$current" ]]; then
            # An older or concurrent run must not move a channel backwards.
            newest="$(node -p '
              const semver = require("semver");
              semver.gt("'"$version"'", "'"$current"'") ? "'"$version"'" : "'"$current"'";
            ' 2>/dev/null || echo "$version")"
            if [[ "$newest" != "$version" ]]; then
              echo "${{ inputs.channel }} already points at $current, which is newer than $version; leaving it."
              exit 0
            fi
          fi

          docker buildx imagetools create --tag "$channel" "$image:${{ inputs.version }}"
          echo "${{ inputs.channel }} now points at $version."
