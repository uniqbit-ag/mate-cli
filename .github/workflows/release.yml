name: Release

# Publishes the npm packages for a signed release tag that `bun release` or
# `bun release:canary` pushed. A tag-triggered run executes the workflow of the
# tagged commit, so publish authority is enforced outside this file: the tag
# ruleset limits who creates release tags, and every npm trusted publisher is
# bound to the `npm-publish` environment. The signature check below adds an
# auditable maintainer identity on top.
#
# Retry: re-run the failed run, or dispatch this workflow with the tag. Packages
# already published with the identical tarball are skipped.
on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. 1.2.3 or 1.3.0-canary.4)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.verify.outputs.channel }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag signature and ancestry
        id: verify
        run: |
          if [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=latest
          elif [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            channel=canary
          else
            echo "::error::Release tag '$RELEASE_TAG' is not x.y.z or x.y.z-canary.n."
            exit 1
          fi

          # Checkout can leave a lightweight copy of the tag; fetch the tag object itself.
          git fetch --no-tags --force origin \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" \
            "+refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::$RELEASE_TAG is a lightweight tag; a release tag must be a signed annotated tag (missing signature)."
            exit 1
          fi

          # Signers come from main, never from the tagged commit, so a tag cannot vouch for itself.
          signers="$RUNNER_TEMP/allowed_signers"
          git show origin/main:.github/allowed_signers > "$signers"
          if ! output="$(git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$RELEASE_TAG" 2>&1)"; then
            echo "$output"
            if [[ "$output" == *"no signature found"* ]]; then
              echo "::error::$RELEASE_TAG carries no signature (missing signature)."
            else
              echo "::error::$RELEASE_TAG is not signed by a key in main's .github/allowed_signers (untrusted signer)."
            fi
            exit 1
          fi
          echo "$output"

          sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$channel" == latest ]] && ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Stable tag $RELEASE_TAG points to $sha, which is not on main."
            exit 1
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish npm packages
    needs: [verify]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        env:
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: ./publish.sh "$CHANNEL" "$RELEASE_TAG"

  image:
    name: Request appliance image
    needs: [verify, publish]
    runs-on: ubuntu-latest
    # Best-effort: a release without an image is a release missing an image, not a failed one.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Dispatch publish-image.yml
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          if gh workflow run publish-image.yml --repo "$GITHUB_REPOSITORY" \
              --field version="$RELEASE_TAG" \
              --field channel="$CHANNEL" \
              --field ref="$RELEASE_TAG"; then
            echo "Requested an appliance image for $RELEASE_TAG ($CHANNEL) from $RELEASE_TAG."
            echo "The build runs on its own; this release is complete either way."
          else
            echo "::warning::npm publication succeeded; the image request was rejected."
            echo "Retry it with:"
            echo "  gh workflow run publish-image.yml --repo $GITHUB_REPOSITORY \\"
            echo "    --field version=$RELEASE_TAG --field channel=$CHANNEL --field ref=$RELEASE_TAG"
            exit 1
          fi
